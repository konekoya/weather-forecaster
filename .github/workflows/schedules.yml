name: Scheduled Report
on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Schedule is using UTC time, we need to convert them to Taipei time 👇
    - cron: 30 21 * * * # 5:30 AM
    - cron: 0 23 * * * # 7:00 AM
    - cron: 30 12 * * * # 20:30 PM

jobs:
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep scheduled workflow enabled
        run: gh workflow enable schedules.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    runs-on: ubuntu-latest
    environment: report
    steps:
      - name: Check out
        uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Create env file
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env
      - run: npm ci
      - run: npm run start
